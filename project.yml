name: DosPhotoPaint
options:
  bundleIdPrefix: com.dosphotopaint
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  DosPhotoPaint:
    type: application
    platform: macOS
    sources:
      - path: DosPhotoPaint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dosphotopaint.DosPhotoPaint
        PRODUCT_NAME: DosPhotoPaint
        INFOPLIST_FILE: DosPhotoPaint/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DosPhotoPaint/Resources/DosPhotoPaint.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "5"
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH[config=Debug]: YES
        # Release must not carry the debugger entitlement (get-task-allow): notarization rejects it.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS[config=Release]: NO
  DosPhotoPaintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DosPhotoPaintTests
    dependencies:
      - target: DosPhotoPaint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.dosphotopaint.DosPhotoPaintTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DosPhotoPaint.app/Contents/MacOS/DosPhotoPaint"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DosPhotoPaint:
    build:
      targets:
        DosPhotoPaint: all
        DosPhotoPaintTests: [test]
    test:
      targets:
        - DosPhotoPaintTests
      gatherCoverageData: false
    run:
      config: Debug
